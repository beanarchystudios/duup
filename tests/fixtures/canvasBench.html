<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { CanvasPage } from '/src/pages/CanvasPage.tsx'
      import { TooltipProvider } from '/src/components/ui/tooltip.tsx'
      import { useStore } from '/src/lib/store.ts'
      import { BENCH_SIZES, benchFrames, countElements } from '/tests/benchCanvas.ts'
      import '/src/styles.css'

      /* the canvas page with a generated benchmark canvas: the frames are
         made in the page, so seeding 1M objects costs no IPC */
      window.canvasBench = {
        seed(size) {
          const frames = benchFrames(BENCH_SIZES[size])
          const objects = frames.reduce((n, f) => n + countElements(f.html), 0)
          useStore.getState().setCanvas({ id: 'c', name: 'Bench', frames, role: 'edit', createdAt: 0, updatedAt: 0 })
          return { frames: frames.length, objects }
        },
        viewport: () => useStore.getState().viewport,
        setViewport: (vp) => useStore.getState().setViewport(vp),
      }
      createRoot(document.getElementById('root')).render(
        React.createElement(TooltipProvider, null, React.createElement(CanvasPage, { canvasId: 'c' })),
      )
    </script>
  </body>
</html>
